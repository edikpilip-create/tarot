name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  DEPLOYMENT_ENV: preview
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Use npm 10.9.8
        run: npm install --global npm@10.9.8

      - name: Check runtime versions
        run: |
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build preview
        run: npm run build
